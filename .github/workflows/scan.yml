name: NSE Daily Momentum Scan

on:
  schedule:
    # 13:45 UTC = 19:15 IST, Mon-Fri (after bhavcopy is published ~6:30-7 PM)
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (daily or backfill)"
        default: "daily"
        required: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: python scanner.py ${{ github.event.inputs.mode || 'daily' }}

      - name: Commit updated history
        run: |
          git config user.name "scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.csv.gz
          git diff --cached --quiet || git commit -m "history update $(date -u +%F)"
          git push
